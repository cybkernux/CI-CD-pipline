name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on:  ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run:  pip install -r requirements.txt

      - name: Run test
        run:  python test.py
